name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    # macOS: the plugin is macOS-only, node-hid builds natively, and the
    # tapkey helper needs the Apple toolchain.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: compile tapkey from source
        working-directory: packages/codex-micro
        run: |
          cc -O2 -arch arm64 -arch x86_64 -mmacosx-version-min=14.0 -o "$RUNNER_TEMP/tapkey" \
            src/tapkey.c -framework ApplicationServices -Wall -Wextra -Werror

      # The guarantee: bin/tapkey runs with the Accessibility permission and is
      # unreadable in a diff, so it has to carry proof of where it came from.
      # This fails unless the committed bytes were produced by
      # build-tapkey.yml in this repository, which a hand-committed binary
      # cannot be. Anyone can run the same check themselves.
      - name: verify tapkey was built by ci
        working-directory: packages/codex-micro
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify bin/tapkey --repo "$GITHUB_REPOSITORY"

      - name: smoke-test the committed tapkey
        working-directory: packages/codex-micro
        run: |
          file bin/tapkey | grep -q 'arm64' || { echo "missing arm64 slice"; exit 1; }
          file bin/tapkey | grep -q 'x86_64' || { echo "missing x86_64 slice"; exit 1; }
          # Argument validation runs ahead of the Accessibility check, so these
          # hold on a runner that has no such permission.
          for bad in "" "notanumber tap" "54 nonsense 0" "999999 tap" "54 tap 99"; do
            # shellcheck disable=SC2086
            if ./bin/tapkey $bad >/dev/null 2>&1; then
              echo "tapkey accepted invalid arguments: '$bad'"
              exit 1
            fi
          done

  # Herdr installs plugins with npm, which ignores pnpm-lock.yaml, so the
  # committed npm lockfile is what real installs resolve against. This runs in
  # its own job on a clean checkout on purpose: with a pnpm node_modules tree
  # present, npm can resolve through those symlinks, and a lockfile that only
  # works on the machine that generated it still appears to install.
  plugin-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install and build exactly as the herdr plugin manifest does
        working-directory: packages/codex-micro
        run: |
          npm ci
          npm run build

      - name: verify the built plugin is runnable
        working-directory: packages/codex-micro
        run: |
          for entry in start ctl restart doctor popup daemon; do
            test -f "dist/$entry.js" || { echo "missing dist/$entry.js"; exit 1; }
          done
          node -e "require('node-hid')"
